<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" role="img" aria-labelledby="title desc">
  <title id="title">夏目漱石 こころ 文庫本風表紙</title>
  <desc id="desc">黒と生成りの幾何学模様を組み合わせた、夏目漱石『こころ』の文庫本風カバー。</desc>
  <defs>
    <pattern id="shortBars" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#eeeade" />
      <path d="M8 7 h23 M8 17 h23 M8 27 h23 M8 37 h23" stroke="#14130f" stroke-width="4" stroke-linecap="round" />
      <path d="M39 7 v23 M29 7 v23 M19 7 v23 M9 7 v23" stroke="#14130f" stroke-width="4" stroke-linecap="round" transform="translate(4 13)" opacity=".95" />
    </pattern>
    <pattern id="thinLines" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#15140f" />
      <path d="M0 3 h16 M0 11 h16" stroke="#e9e4d5" stroke-width="2" opacity=".88" />
    </pattern>
    <pattern id="dotRows" width="28" height="34" patternUnits="userSpaceOnUse">
      <rect width="28" height="34" fill="#11100d" />
      <rect x="11" y="5" width="5" height="17" rx="3" fill="#efeadd" opacity=".88" />
    </pattern>
    <pattern id="checker" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="#eeeade" />
      <rect x="9" y="9" width="13" height="13" rx="3" fill="#11100d" />
      <rect x="31" y="31" width="13" height="13" rx="3" fill="#11100d" />
    </pattern>
    <filter id="paper" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="8" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" result="mono" />
      <feBlend in="SourceGraphic" in2="mono" mode="multiply" opacity=".18" />
    </filter>
  </defs>
  <rect width="420" height="640" fill="#eeeade" />
  <g filter="url(#paper)">
    <rect x="0" y="0" width="156" height="250" fill="url(#shortBars)" />
    <rect x="156" y="0" width="264" height="408" fill="url(#thinLines)" />
    <rect x="0" y="250" width="166" height="390" fill="url(#dotRows)" />
    <rect x="166" y="408" width="254" height="232" fill="url(#checker)" />
    <rect x="306" y="27" width="114" height="322" fill="#f5f2e8" />
    <rect x="306" y="27" width="114" height="322" fill="none" stroke="#d7d0c1" stroke-width="1" />
    <text x="379" y="57" writing-mode="vertical-rl" font-family="Hiragino Mincho ProN, Yu Mincho, serif" font-size="16" fill="#2a2924" letter-spacing=".16em">夏目漱石</text>
    <text x="351" y="59" writing-mode="vertical-rl" font-family="Hiragino Mincho ProN, Yu Mincho, serif" font-size="34" fill="#22211d" letter-spacing=".18em">こころ</text>
    <text x="390" y="247" writing-mode="vertical-rl" font-family="Hiragino Mincho ProN, Yu Mincho, serif" font-size="13" fill="#3e3b34" letter-spacing=".12em">角川文庫</text>
  </g>
</svg>
